[project]
name = "math-study"
version = "0.1.0"
description = "Mathematics study notebooks"
readme = "README.md"
authors = [
    { name = "Lucas Minchillo", email = "lucasmminchillo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.9",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "plotly-express>=0.4.1",
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter-collaboration>=5.0.0",
    "jupyter-mcp-tools>=0.1.7",
    "jupyterlab>=4.6.3",
]
